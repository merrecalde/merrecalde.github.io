teaching:
  title: Teaching
  info:
  - details: |
      
      - Tenured Full-time Associate Professor (UNSL, 2015 Present)
      - Tenured Part-time Assistant Professor (UNPA-UACO, 2010 Present)

      Responsible for teaching the following undergraduate courses: Artificial Intelligence, Intelligent
      Systems, Foundations of Artificial Intelligence, Agents and Multi-agent Systems, Machine Learning,
      Data Mining

      Postgraduate Courses: I have taught 36 postgraduate courses on the following topics: Machine
      Learning and Data Mining (UNSL and UNPA), Agents and Multi-agent Systems (UNPA, UNLP,
      UNSL), Advanced Topics in Text and Web Mining (UBA), Data Mining (UNSL), Text Mining

      (UNSL, UNPA, UNLP), Models and Architectures for Artificial Intelligent Agents (UNSL),
      Information Systems in Agriculture (UNSL), Data Analysis in Social Networks (University of the
      Azuay, Ecuador), Natural Language Processing (Universidad Abierta Interamericana, UAI)

research:
  title: Research
  list:
  - details: |
      Since April 1987, I have participated uninterruptedly as a member of 25 research projects, serving as
      Director for 4 of these projects and Co-director for 2.

      - Director: Laboratorio de Investigación y Desarrollo en Inteligencia Computacional (LIDIC),
        Faculty of Physical, Mathematical and Natural Sciences, Universidad Nacional de San Luis.
      - Creator and Director: Instituto de Ciencias Computacionales, Cognitivas, Psicológicas y
        Sociales (ICOPS), Universidad Nacional de San Luis.

      Research Interests: Artificial Intelligence, Intelligent Systems, Multi-agent Systems, Machine
      Learning, Text Mining, Natural Language Processing and Robotics


