{% assign teaching = site.data.data.teaching %}
{% if teaching %}
<section class="section experiences-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <!--/ <i class="fas book-open-cover fa-stack-1x fa-inverse"></i> -->
      <i class="fas fa-box-open fa-stack-1x fa-inverse"></i>
    </span>
    {{ teaching.title }}
  </h2>

  {% for teaching in teaching.info %}
  <div class="item">   

    {% if teaching.details %}
    <div class="details">
      {{ teaching.details | markdownify }}
    </div><!--//details-->
    {% endif %}

  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
